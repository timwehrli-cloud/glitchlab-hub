<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tundra-Game</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=VT323&display=swap">
<style>
/* Layout: Seitenleiste mit Menü und senkrechtem Wärme-Tank, rechts eine Spielkarte pro Schritt; Maskottchen Grizz fix oben rechts */
:root{
  --bg:#e3eef5; --bg2:#cfe1ec; --surface:#fbfdff; --ink:#1d2a36; --muted:#56697a; --line:#c2d5e2;
  --accent:#2f6fb0; --accent-ink:#ffffff; --sun:#e0662a; --e1:#2f6fb0; --e2:#1f8f84; --e3:#6b4fc9; --e4:#c43d55;
  --good:#2f8a3d; --warn:#b5651d; --chip:#eaf2f8; --shadow:0 2px 0 #a9c0d1;
  --ill-sky:#dcecf6; --ill-sand:#f4f9fc; --ill-sand2:#c9dcea; --ill-rock:#7a6a5a; --ill-rock2:#4f4336; --ill-sun:#f6c234; --ill-water:#3a8fc0; --ill-dark:#16233a; --ill-ink:#1d2a36; --ill-snake:#5a7a4a;
  --display:"Bungee","Arial Black",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif; --hud:"VT323",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1622; --bg2:#142033; --surface:#182638; --ink:#e6eef6; --muted:#9fb2c4; --line:#2b3d55;
  --accent:#6fb0f0; --accent-ink:#10202a; --sun:#f3a05a; --e1:#6fb0f0; --e2:#43cdbd; --e3:#a68cff; --e4:#ff7a90;
  --good:#6fd17c; --warn:#f0b060; --chip:#1f3148; --shadow:0 2px 0 #070c13; color-scheme:dark;
  --ill-sky:#1a2a44; --ill-sand:#d6e4ef; --ill-sand2:#9fb6c9; --ill-rock:#5a4e42; --ill-rock2:#3a3128; --ill-sun:#f1e4a6; --ill-water:#3f9ad0; --ill-dark:#070c13; --ill-ink:#e6eef6; --ill-snake:#8fcf55}}
:root[data-theme="dark"]{
  --bg:#0e1622; --bg2:#142033; --surface:#182638; --ink:#e6eef6; --muted:#9fb2c4; --line:#2b3d55;
  --accent:#6fb0f0; --accent-ink:#10202a; --sun:#f3a05a; --e1:#6fb0f0; --e2:#43cdbd; --e3:#a68cff; --e4:#ff7a90;
  --good:#6fd17c; --warn:#f0b060; --chip:#1f3148; --shadow:0 2px 0 #070c13; color-scheme:dark;
  --ill-sky:#1a2a44; --ill-sand:#d6e4ef; --ill-sand2:#9fb6c9; --ill-rock:#5a4e42; --ill-rock2:#3a3128; --ill-sun:#f1e4a6; --ill-water:#3f9ad0; --ill-dark:#070c13; --ill-ink:#e6eef6; --ill-snake:#8fcf55}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(ellipse 120% 40% at 50% 105%,var(--bg2),transparent 70%);background-attachment:fixed}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;overflow-y:auto;background:var(--surface);border-right:2.5px solid var(--ink);padding-block:16px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:12px;z-index:35}
.mainwrap{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 110px}
.mainwrap main{max-width:860px;margin:0 auto}
.sgrp{display:flex;flex-direction:column;gap:1px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font-size:14px;color:var(--muted)}
.sgrp b{font-size:16px;color:var(--ink)}.sgrp-lv{font-family:var(--hud);font-size:17px;color:var(--sun)}
.side-body{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;flex:none}
.side-tank{display:flex}
.side-foot{display:flex;flex-direction:column;gap:8px;border-top:2px solid var(--line);padding-top:10px}
.side-foot .footbtns button{border:0;background:none;color:var(--muted);font-family:var(--hud);font-size:18px;text-decoration:underline;padding:0}
.side-src{font-family:var(--hud);font-size:15px;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:2px}
.menu-et{margin-bottom:6px}
.menu-et h4{font-family:var(--hud);font-size:16px;font-weight:400;color:var(--c);margin:0 0 2px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:4px 8px;border-radius:8px;font-size:15px;color:var(--ink);min-height:32px}
.menu-item .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none;color:var(--muted);background:var(--surface)}
.menu-item.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.menu-item.now{background:var(--c);color:var(--accent-ink);font-weight:700;box-shadow:var(--shadow)}
.menu-item.now .dot{border-color:var(--accent-ink);background:transparent;color:var(--accent-ink)}
.menu-item.locked{color:var(--muted);opacity:.6;cursor:not-allowed}
.menu-item.open .dot{border-color:var(--c);border-style:dashed}
.menu-item.done:hover{background:color-mix(in srgb,var(--c) 14%,transparent)}
.menu-item.gate{font-size:13px;color:var(--muted)}.menu-item.gate.now{color:var(--accent-ink)}
.menubtn{display:none;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:700;box-shadow:var(--shadow)}
.hud-title{display:flex;flex-direction:column;line-height:1.1}
.hud-et{font-family:var(--hud);font-size:19px;color:var(--c)}
.hud-name{font-family:var(--display);font-size:clamp(20px,3vw,28px)}
.hud .wtank{display:none}
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);z-index:34}
@media (max-width:900px){
 .app{display:block}
 .side{position:fixed;top:0;bottom:0;left:0;height:auto;width:min(300px,86vw);transform:translateX(-105%);transition:transform .25s ease;box-shadow:6px 0 24px rgba(0,0,0,.25)}
 .side.open{transform:none}
 .menubtn{display:inline-flex}
 .hud .wtank{display:flex;flex-basis:100%;max-width:none;order:3}
}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-right:100px;min-height:84px;max-width:860px;margin:0 auto}
.logo{font-family:var(--display);font-size:clamp(20px,4vw,28px);letter-spacing:.02em;line-height:1;color:var(--ink)}
.logo small{display:block;font-family:var(--hud);font-size:18px;color:var(--muted);letter-spacing:.04em}
.tank{display:flex;align-items:center;gap:8px;font-family:var(--hud);font-size:20px}
.tank-bar{width:150px;height:18px;border:2px solid var(--ink);border-radius:4px;overflow:hidden;background:var(--surface);position:relative}
.tank-fill{height:100%;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,color-mix(in srgb,var(--accent) 80%,#fff) 10px 12px);transition:width .8s ease}
.etappen{display:flex;gap:6px}
.et{font-family:var(--hud);font-size:18px;padding:0 8px;border:2px solid var(--line);border-radius:4px;color:var(--muted);background:var(--surface)}
.et.on{border-color:var(--ec);color:var(--ink);background:color-mix(in srgb,var(--ec) 18%,var(--surface))}
.et.done{border-color:var(--ec);background:var(--ec);color:var(--accent-ink)}
.grp{font-family:var(--hud);font-size:20px;color:var(--muted)}

/* Fenni */
.fenni{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:20;width:80px;height:80px;border:0;background:none;padding:0}
.fenni svg{width:80px;height:80px;image-rendering:pixelated;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.fenni.happy svg{animation:hop .5s ease 2}
.fenni.dig svg{animation:dig 1.6s ease forwards}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes hop{50%{transform:translateY(-12px) rotate(-6deg)}}
@keyframes dig{40%{transform:translateY(60px) scaleY(.4);opacity:0}60%{transform:translateY(60px);opacity:0}100%{transform:none;opacity:1}}
.bubble{position:fixed;top:calc(100px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:20;max-width:min(300px,calc(100vw - 32px));background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;top:-9px;right:30px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:rotate(45deg)}
.bubble b{font-family:var(--hud);font-size:19px;font-weight:400;color:var(--sun)}
.heart{position:fixed;z-index:21;pointer-events:none;font-family:var(--hud);font-size:26px;color:var(--e4);animation:up 1.2s ease-out forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}

/* Card */
.card{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:clamp(18px,4vw,32px);box-shadow:4px 4px 0 var(--ec,var(--ink));margin-top:14px}
.eyebrow{font-family:var(--hud);font-size:20px;color:var(--ec,var(--sun));letter-spacing:.04em;text-transform:uppercase}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,5vw,40px);line-height:1.1;margin:4px 0 12px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(20px,3.6vw,26px);line-height:1.15;margin:4px 0 10px}
h3{font-size:19px;margin:0 0 6px}
p{margin:0 0 12px;max-width:65ch}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.box{border:2px dashed var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.box.solid{border-style:solid}
.task{display:inline-block;font-family:var(--hud);font-size:18px;background:var(--chip);border-radius:4px;padding:0 8px;color:var(--muted)}

.btn{border:2px solid var(--ink);background:var(--surface);border-radius:10px;padding:10px 18px;font-weight:700;box-shadow:var(--shadow);min-height:48px}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--ec,var(--accent));color:var(--accent-ink);border-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.small{min-height:38px;padding:6px 12px;font-size:15px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.hint{font-size:15px;color:var(--muted)}

input[type=text],input[type=password],textarea,select{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;min-height:46px}
textarea{min-height:96px;resize:vertical}
label{font-weight:700;display:block;margin-bottom:4px}

/* briefing */
.briefing{font-family:var(--hud);font-size:23px;line-height:1.3;background:var(--ink);color:var(--surface);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden}
.briefing p{max-width:none;margin:0 0 8px}
.briefing .sp{color:var(--sun)}

/* options */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;min-height:48px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.wrong{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--surface));text-decoration:line-through;opacity:.8}
.fb{font-size:15px;margin-top:6px}
.fb.ok{color:var(--good)} .fb.no{color:var(--warn)}

/* flip cards */
.flip{perspective:800px;border:0;background:none;padding:0;min-height:130px;text-align:left}
.flip-in{position:relative;width:100%;height:100%;min-height:130px;transition:transform .5s;transform-style:preserve-3d}
.flip.open .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--ink);border-radius:10px;padding:12px;display:flex;flex-direction:column;justify-content:center;background:var(--chip)}
.face.back{transform:rotateY(180deg);background:var(--surface);font-size:15px}
.face .w{font-family:var(--display);font-size:18px;line-height:1.15}
.face .art{font-family:var(--hud);font-size:18px;color:var(--muted)}
.flip,.flip-in{min-height:236px}
.face .ill{aspect-ratio:12/7;height:auto;max-height:none}
.face{justify-content:flex-start;gap:4px}
.face.back{justify-content:center}
.ill{width:100%;height:auto;max-height:96px;display:block;border-radius:6px;background:var(--ill-sky);margin-bottom:4px}
.ill *{transform-box:fill-box;transform-origin:center}
.ill .sand{fill:var(--ill-sand)} .ill .sand2{fill:var(--ill-sand2)} .ill .rock{fill:var(--ill-rock)} .ill .rock2{fill:var(--ill-rock2)}
.ill .sun{fill:var(--ill-sun)} .ill .water{fill:var(--ill-water)} .ill .dark{fill:var(--ill-dark)} .ill .ink{fill:var(--ill-ink)}
.ill .snake{fill:none;stroke:var(--ill-snake);stroke-width:5;stroke-linecap:round}
.ill .wind{fill:none;stroke:var(--ill-sand2);stroke-width:3;stroke-linecap:round;stroke-dasharray:18 12}
.ill .path{fill:none;stroke:var(--ill-ink);stroke-width:2;stroke-dasharray:3 4}
.a-pulse{animation:pulse 2.6s ease-in-out infinite}
.a-shim{animation:shim 1.8s ease-in-out infinite}
.a-wind{animation:wind 1.2s linear infinite}
.a-wind.s2{animation-duration:.9s}
.a-drift{animation:drift 2.4s ease-in-out infinite}
.a-drop{animation:drop 1.4s ease-in infinite}
.a-drop.d2{animation-delay:.45s}.a-drop.d3{animation-delay:.9s}
.a-ripple{animation:ripple 1.8s ease-out infinite}
.a-walk{animation:walk 5s linear infinite}
.a-blink{animation:blink 3.2s step-end infinite}
.a-slither{animation:slither 1.4s linear infinite}
.a-tongue{animation:tongue 1.1s steps(2) infinite}
.a-sway{animation:sway 2.8s ease-in-out infinite}
.a-flag{animation:flag 1s ease-in-out infinite;transform-origin:0 50%}
.a-bob{animation:bob 1.6s ease-in-out infinite}
.a-roll{animation:roll 3.5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes shim{50%{transform:translateY(-3px);opacity:.4}}
@keyframes wind{to{stroke-dashoffset:-60}}
@keyframes drift{50%{transform:translateX(8px)}}
@keyframes drop{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(16px);opacity:0}}
@keyframes ripple{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes walk{0%{transform:translateX(-40px)}100%{transform:translateX(40px)}}
@keyframes blink{0%,88%{transform:scaleY(1)}90%,96%{transform:scaleY(.1)}}
@keyframes slither{to{stroke-dashoffset:-40}}
@keyframes tongue{50%{transform:scaleX(0)}}
@keyframes sway{50%{transform:rotate(-8deg)}}
@keyframes flag{50%{transform:skewY(10deg) scaleX(.85)}}
@keyframes roll{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(14px) rotate(180deg)}}
.pcard{display:flex;flex-direction:column;gap:6px;cursor:pointer}
.pcard .ill{max-height:none;aspect-ratio:12/7;height:auto;margin:0}
.pcard .more{font-family:var(--hud);font-size:17px;font-weight:400;color:#6b5636}
.pop-ill{max-height:170px;margin-bottom:10px}
.pc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.pc .box h3{display:flex;gap:8px;align-items:center}
.pc .plus{border-color:var(--good)} .pc .minus{border-color:var(--warn)}
.pc .plus h3{color:var(--good)} .pc .minus h3{color:var(--warn)}
.a-spin{animation:spin 8s linear infinite}
.a-flap{animation:flap .5s ease-in-out infinite}
.a-fly{animation:fly 3s ease-in-out infinite}
.a-lift{animation:lift 1.6s ease-in-out infinite}
.a-needle{animation:needle 2.2s ease-in-out infinite;transform-origin:50% 50%}
.a-glow{animation:glow 1.8s ease-in-out infinite}
.a-talk{animation:talk 2.4s step-end infinite}
.a-talk.t2{animation-delay:1.2s}
.a-dash{animation:dashx .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flap{50%{transform:scaleY(.3)}}
@keyframes fly{50%{transform:translate(14px,-6px)}}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes needle{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
@keyframes glow{50%{opacity:.25}}
@keyframes talk{0%{opacity:1}50%{opacity:0}}
@keyframes dashx{to{transform:translateX(-14px);opacity:0}}
.connect{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 clamp(36px,8vw,90px);margin-top:8px}
.clines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.ccol{display:flex;flex-direction:column;gap:8px;justify-content:space-around;min-width:0}
.cob{border:2px solid var(--ink);background:var(--chip);border-radius:10px;padding:8px;text-align:left;font-weight:700;font-size:15px;display:flex;flex-direction:column;gap:4px}
.cob .ill{max-height:64px;margin:0}
.cpw{display:flex;align-items:center;gap:8px;border:2px solid #8b7a5c;background:linear-gradient(#e9dcbf,#d8c6a0);color:#3a2c18;border-radius:6px;padding:4px 8px;text-align:left;font-weight:700;font-size:14px;line-height:1.2;min-height:44px}
.cpw .ill{width:48px;height:28px;flex:none;margin:0;border-radius:4px}
.cob.sel{outline:4px solid var(--ec);outline-offset:2px;animation:pulse 1.2s ease-in-out infinite}
.cob.linked,.cpw.linked{border-color:var(--ink);box-shadow:0 0 0 2px var(--ec)}
.cl{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:0;animation:drawl .7s ease-out}
.cl.ok{stroke:var(--good)} .cl.no{stroke:var(--warn)}
.cd.ok{fill:var(--good)} .cd.no{fill:var(--warn)}
.still .cl{animation:none}
@keyframes drawl{from{stroke-dashoffset:600}}
@media (max-width:520px){.cpw .ill{display:none}.cob .ill{max-height:48px}}
.lab-ic{display:flex;align-items:center;gap:10px}.lab-ic .ill{width:60px;height:35px;flex:none;margin:0;border-radius:4px}
.power.pcard.sel .ill{outline:2px solid var(--ec)}
/* Superkraft-Animationen */
.k-pop,.k-pling{transform-origin:center;transform-box:fill-box}
.k-pop{animation:kpop 2.6s ease-out infinite}
@keyframes kpop{0%,40%{transform:scale(0) rotate(-8deg);opacity:0}52%{transform:scale(1.35) rotate(-8deg);opacity:1}60%,88%{transform:scale(1) rotate(-8deg);opacity:1}100%{transform:scale(1.1) rotate(-8deg);opacity:0}}
.k-twinkle{animation:ktw 1.6s ease-in-out infinite}
@keyframes ktw{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1.2) rotate(45deg);opacity:1}}
.k-cape{animation:kcape .8s ease-in-out infinite;transform-origin:30% 0%}
.k-flutter{animation:kflut .25s ease-in-out infinite;transform-origin:30% 0%}
@keyframes kcape{50%{transform:skewX(-10deg)}}
@keyframes kflut{50%{transform:skewX(-22deg) scaleY(.85)}}
.k-scent{animation:kscent 1s linear infinite}
@keyframes kscent{to{stroke-dashoffset:24}}
.k-throb{animation:kthrob 1s ease-in-out infinite}
@keyframes kthrob{50%{transform:scale(1.15)}}
.k-sniff{animation:ksniff 1s ease-in-out infinite}
@keyframes ksniff{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-2px) rotate(8deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-2px) rotate(8deg)}}
.k-scroll{animation:kscroll 4s linear infinite}
.k-scroll-slow{animation:kscroll 7s linear infinite}
.k-scroll-fast{animation:kscroll 1.1s linear infinite}
@keyframes kscroll{to{transform:translateX(-120px)}}
.k-speed{animation:kspeed .6s linear infinite}
.k-speed-fast{animation:kspeed .3s linear infinite}
@keyframes kspeed{0%{transform:translateX(10px);opacity:1}100%{transform:translateX(-14px);opacity:0}}
.k-hover{animation:khover 1.4s ease-in-out infinite}
@keyframes khover{50%{transform:translateX(-5px)}}
.k-flapbird{animation:kflap .35s ease-in-out infinite}
@keyframes kflap{50%{transform:scaleY(-.6)}}
.k-bounce{animation:kbounce 1.2s ease-in-out infinite}
@keyframes kbounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}55%{transform:translateY(0) scaleY(.92)}}
.k-nod{animation:knod 1.4s ease-in-out infinite;transform-origin:20% 80%}
@keyframes knod{50%{transform:rotate(-5deg)}}
.k-talk1{animation:ktalk1 3s ease-out infinite}
.k-talk2{animation:ktalk2 3s ease-out infinite}
@keyframes ktalk1{0%{transform:scale(0);opacity:0}8%{transform:scale(1.2);opacity:1}14%,42%{transform:scale(1);opacity:1}50%,100%{transform:scale(0);opacity:0}}
@keyframes ktalk2{0%,50%{transform:scale(0);opacity:0}58%{transform:scale(1.2);opacity:1}64%,92%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}
.k-float{animation:kfloat 1.8s ease-out infinite}
@keyframes kfloat{0%{transform:translateY(0) scale(.5);opacity:0}30%{opacity:1}100%{transform:translateY(-18px) scale(1.2);opacity:0}}
.k-shake{animation:kshake 1.6s linear infinite}
@keyframes kshake{0%,45%,60%,100%{transform:translate(0,0)}48%{transform:translate(-2px,1px)}52%{transform:translate(2px,-1px)}56%{transform:translate(-1px,1px)}}
.k-lift{animation:klift 1.6s cubic-bezier(.5,0,.5,1) infinite}
@keyframes klift{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px) rotate(-6deg)}46%{transform:translateY(2px) rotate(0)}52%{transform:translateY(0)}}
.k-puff{animation:kpuff 1.6s ease-out infinite}
@keyframes kpuff{0%,44%{transform:scale(0);opacity:0}50%{transform:scale(1);opacity:.9}80%,100%{transform:scale(2.2);opacity:0}}
.k-chip{animation:kchip 1.6s ease-out infinite}.k-chip2{animation:kchip2 1.6s ease-out infinite}
@keyframes kchip{0%,46%{transform:translate(0,0);opacity:0}50%{opacity:1}80%,100%{transform:translate(-10px,-14px);opacity:0}}
@keyframes kchip2{0%,46%{transform:translate(0,0);opacity:0}50%{opacity:1}80%,100%{transform:translate(10px,-14px);opacity:0}}
.k-draw{stroke-dasharray:4 4;animation:kdraw 3s linear infinite}
@keyframes kdraw{0%{opacity:0;stroke-dashoffset:40}10%{opacity:1}100%{stroke-dashoffset:0}}
.k-pin{animation:kpin 3s ease-in infinite;transform-origin:50% 100%}
@keyframes kpin{0%,55%{transform:translateY(-30px);opacity:0}70%{transform:translateY(0) scaleY(.8);opacity:1}78%{transform:translateY(-4px)}85%,100%{transform:translateY(0);opacity:1}}
.k-compass{animation:kcomp 3s ease-in-out infinite}
@keyframes kcomp{0%{transform:rotate(0)}40%{transform:rotate(700deg)}55%{transform:rotate(690deg)}65%,100%{transform:rotate(675deg)}}
.k-sweep{animation:ksweep 3s ease-in-out infinite}
@keyframes ksweep{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
.k-glow2{animation:kglow2 1.2s ease-in-out infinite}
@keyframes kglow2{50%{transform:scale(1.6);opacity:.15}}
.k-batfly{animation:kbat 3s ease-in-out infinite}
@keyframes kbat{0%,100%{transform:translate(0,0)}25%{transform:translate(-12px,6px)}50%{transform:translate(4px,-4px)}75%{transform:translate(10px,6px)}}
.k-run{animation:krun .3s ease-in-out infinite}
@keyframes krun{50%{transform:translateY(-3px)}}
.k-shield{animation:kshield 2.4s ease-out infinite}
@keyframes kshield{0%,38%{transform:scale(.9);opacity:.15}45%{transform:scale(1.15);opacity:.9}70%,100%{transform:scale(1);opacity:.3}}
.k-lunge{animation:klunge 2.4s cubic-bezier(.6,0,.4,1) infinite}
@keyframes klunge{0%,25%{transform:translateX(0)}42%{transform:translateX(-30px)}50%{transform:translateX(-26px) rotate(8deg)}70%,100%{transform:translateX(0) rotate(0)}}
.k-dizzy{animation:kdizzy 2.4s linear infinite}
@keyframes kdizzy{0%,48%{opacity:0;transform:rotate(0)}55%{opacity:1}90%{opacity:1;transform:rotate(360deg)}100%{opacity:0;transform:rotate(400deg)}}
.k-pling{animation:kpling 2.4s ease-out infinite}
@keyframes kpling{0%,40%{transform:scale(0) rotate(-8deg);opacity:0}46%{transform:scale(1.4) rotate(-8deg);opacity:1}54%,80%{transform:scale(1) rotate(-8deg);opacity:1}92%,100%{opacity:0}}
.k-spinrays{animation:spin 3s linear infinite}
.k-ray{animation:kray .5s linear infinite}
@keyframes kray{to{stroke-dashoffset:12}}
.k-ice{animation:kice 1.6s ease-in-out infinite}
@keyframes kice{50%{transform:scale(1.08);opacity:.75}}
.k-orbit{animation:spin 5s linear infinite}
.k-slosh{animation:kslosh 1.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes kslosh{50%{transform:skewY(4deg)}}
.pcard:hover .ill,.pcard:focus-visible .ill{filter:saturate(1.3) brightness(1.05)}
.recbox{border:2px solid var(--e4);border-radius:10px;padding:12px 16px;background:color-mix(in srgb,var(--e4) 10%,var(--surface))}.recbox h3{color:var(--e4)}
/* Levelwahl */
.lvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.lvcard{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;border:2px solid var(--ink);border-radius:12px;padding:10px;background:var(--surface);box-shadow:4px 4px 0 var(--lc);transition:transform .15s}
.lvcard:not([disabled]):hover{transform:translateY(-3px)}
.lvcard.cur{outline:3px solid var(--lc);outline-offset:2px}
.lvcard .ill{aspect-ratio:12/7;height:auto;max-height:none;margin:0}
.lvcard.locked{cursor:not-allowed}.lvcard.locked .ill{filter:grayscale(1) brightness(.7)}.lvcard.locked>span:not(.lock){opacity:.6}
.lvtop{display:flex;justify-content:space-between;align-items:center}
.lvn{font-family:var(--hud);font-size:20px;color:var(--lc)}
.lvstars{color:var(--sun);font-size:18px;letter-spacing:2px}
.lvname{font-family:var(--display);font-size:19px;line-height:1.15}
.lvteaser{font-size:15px;color:var(--muted)}
.lvstate{font-weight:700;font-size:15px;color:var(--lc);margin-top:auto;padding-top:8px;border-top:2px dashed var(--line);min-height:52px;display:flex;align-items:center}
.lvname{min-height:2.3em;display:flex;align-items:flex-end}
.lvteaser{min-height:2.8em}
.lock{position:absolute;top:34px;left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--ink);border-radius:50%;width:58px;height:58px;display:grid;place-items:center}
.footbtns{display:flex;gap:16px}
/* Level-2/3-Animationen */
.a-spinslow{animation:spin 3s linear infinite}
.a-sink{animation:asink 3s ease-in-out infinite}
@keyframes asink{0%,100%{transform:translateY(-4px)}50%{transform:translateY(10px)}}
.a-wobble{animation:awob 1.6s ease-in-out infinite}
@keyframes awob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.a-fall{animation:afall 1.5s ease-in infinite}
@keyframes afall{0%{transform:translateY(-10px) rotate(0);opacity:0}15%{opacity:1}85%{transform:translateY(46px) rotate(200deg);opacity:1}100%{transform:translateY(48px) rotate(220deg);opacity:0}}
.a-bounce-x{animation:abx 1.2s ease-in-out infinite}
@keyframes abx{50%{transform:translateX(5px)}}
.a-flicker{animation:aflick .25s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes aflick{to{transform:scaleY(1.18) scaleX(.9) skewX(4deg)}}
.a-crawl{animation:acrawl 2.4s ease-in-out infinite}
@keyframes acrawl{50%{transform:translateX(-10px)}}
.a-sting{animation:asting 1.2s ease-in-out infinite}
@keyframes asting{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-30deg)}80%{transform:rotate(10deg)}}
.a-runaway{animation:arun 2.8s linear infinite}
@keyframes arun{0%{transform:translateX(-30px)}100%{transform:translateX(80px)}}
.a-step{animation:astep 2.4s ease-out infinite;opacity:0}
@keyframes astep{0%{opacity:0;transform:scale(.4)}10%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.a-mirage{animation:amir 3s ease-in-out infinite}
@keyframes amir{0%,100%{opacity:.15;transform:skewX(-6deg)}50%{opacity:.95;transform:skewX(6deg)}}
.a-dry{animation:adry 3s ease-in infinite}
@keyframes adry{0%{transform:scale(1);opacity:1}80%,100%{transform:scale(.1);opacity:0}}
.k-draw2{animation:kdraw2 4s linear infinite}
@keyframes kdraw2{0%{stroke-dashoffset:140;opacity:0}5%{opacity:1}100%{stroke-dashoffset:0}}
.a-walkin{animation:awalkin 3s ease-in-out infinite}
@keyframes awalkin{0%{transform:translateX(40px)}50%,100%{transform:translateX(0)}}
.winscene{width:100%;max-width:560px;aspect-ratio:24/11;height:auto;max-height:none;border-radius:12px;border:2px solid var(--ink)}
.k-river{animation:kriver .8s linear infinite}@keyframes kriver{to{stroke-dashoffset:-16}}
.k-fountain{animation:kfount .6s ease-in-out infinite alternate;transform-origin:50% 100%}@keyframes kfount{to{transform:scaleY(1.2) scaleX(1.1)}}
/* Wegweiser, Auftrag, Glossar, NEU */
.path{display:flex;align-items:center;gap:0;overflow-x:auto;padding:6px 2px 8px;margin-top:4px;scrollbar-width:thin}
.pstep{flex:none;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;border:2px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.pstep.done{border-color:var(--good);color:var(--good)}
.pstep.now{border-color:var(--ink);background:var(--ec);color:var(--accent-ink);box-shadow:var(--shadow)}
.pstep.gate{padding:4px 6px;display:inline-grid;place-items:center}
.pline{flex:none;width:12px;height:2px;background:var(--line)}
.todo{border:2px solid var(--ec);border-radius:12px;background:color-mix(in srgb,var(--ec) 9%,var(--surface));padding:10px 14px 10px;margin:0 0 16px}
.todo-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.todo-h span:first-child{font-family:var(--hud);font-size:21px;color:var(--ec);letter-spacing:.03em}
.todo .who{font-size:13px;font-weight:700;background:var(--ec);color:var(--accent-ink);border-radius:999px;padding:2px 10px}
.todo ol{margin:0;padding-left:22px}.todo li{margin:2px 0}
.gl{text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--sun);text-decoration-thickness:2.5px;text-underline-offset:3px;cursor:help;border-radius:3px}
.gl:hover,.gl:focus-visible{background:color-mix(in srgb,var(--sun) 22%,transparent)}
.briefing .gl{text-decoration-color:var(--sun)}
.glw{display:inline-block;font-weight:700;color:var(--ink);background:color-mix(in srgb,var(--sun) 25%,transparent);border-radius:4px;padding:0 5px;margin-right:2px}
.bspeak{display:inline-block;margin-top:6px;border:2px solid var(--ink);background:var(--chip);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700}
.neu{position:absolute;top:-9px;left:-8px;z-index:1;background:#c43d55;color:#fff;font-family:var(--display);font-size:11px;padding:2px 7px;border-radius:6px;border:2px solid var(--ink);transform:rotate(-6deg);animation:kthrob 1.4s ease-in-out infinite}
.mute{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.mute[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
/* neue Kraft-Animationen */
.k-swirl{animation:spin 1.4s linear infinite}
.k-rise{animation:krise 2.4s ease-out infinite;transform-origin:50% 100%}
@keyframes krise{0%,20%{transform:scaleY(0)}60%,100%{transform:scaleY(1)}}
.k-grow{animation:kgrow 2.6s cubic-bezier(.5,1.6,.5,1) infinite;transform-origin:50% 100%}
@keyframes kgrow{0%,15%{transform:scale(.7)}45%,85%{transform:scale(1.7)}100%{transform:scale(.7)}}
.k-flee{animation:kflee 2s ease-in infinite}
@keyframes kflee{0%{transform:translateX(-14px)}100%{transform:translateX(30px);opacity:0}}
.k-phase{animation:kphase 3s ease-in-out infinite}
@keyframes kphase{0%{transform:translateX(-36px);opacity:1}40%{opacity:1}50%{transform:translateX(0);opacity:.25}60%{opacity:1}100%{transform:translateX(36px);opacity:1}}
.k-fake{animation:kfake 3s ease-in-out infinite}
@keyframes kfake{0%,30%{opacity:1}60%,100%{opacity:.08}}
.k-fakex{animation:kfakex 3s ease-out infinite}
@keyframes kfakex{0%,35%{transform:scale(0);opacity:0}48%{transform:scale(1.3);opacity:1}60%,90%{transform:scale(1);opacity:1}100%{opacity:0}}
.k-invis{animation:kinvis 3s ease-in-out infinite}
@keyframes kinvis{0%,20%,100%{opacity:1}45%,75%{opacity:.06}}
.spk-wrap{margin-top:20px}
.spk-person{margin-top:12px}.spk-person h3{margin-bottom:6px}
.spk-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.spk{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;border:2px solid var(--ink);border-radius:12px;padding:8px;text-align:center;color:#fff8ea;background:repeating-linear-gradient(45deg,#6b4fc9 0 10px,#5b40b0 10px 20px);box-shadow:var(--shadow)}
.spk .spk-q{font-family:var(--display);font-size:44px;line-height:1;color:#f6b434}
.spk .spk-pl{font-family:var(--hud);font-size:18px}
.spk .spk-hint{font-size:12px;opacity:.85}
.spk.open{background:var(--surface);color:var(--ink);justify-content:flex-start;text-align:left;align-items:stretch}
.spk.open .ill{aspect-ratio:12/7;height:auto;max-height:none;margin:0}
.spk.open .spk-pl{color:var(--ec)}
.spk-t{font-weight:700;font-size:15px;line-height:1.2}
.spk-w{font-size:14px;color:var(--muted);line-height:1.35}
.spk.flipin{animation:spkflip .45s ease-out}
@keyframes spkflip{0%{transform:perspective(600px) rotateY(90deg)}100%{transform:perspective(600px) rotateY(0)}}
@media (max-width:560px){.spk-row{grid-template-columns:1fr}}
.gsum{width:100%;max-width:640px;text-align:left;border:2px dashed var(--ink);border-radius:12px;padding:12px 14px;background:var(--bg)}
.gs-h{font-family:var(--hud);font-size:21px;color:var(--ec)}
.gs-name{font-size:14px;color:var(--muted);margin-bottom:6px}
.gs-t{width:100%;border-collapse:collapse;font-size:14px}
.gs-t th{width:34%;text-align:left;vertical-align:top;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);font-weight:700}
.gs-t td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.gs-chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;margin:1px 0}
.gs-chip.ok{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.gs-chip.mid{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.gs-chip.no{background:color-mix(in srgb,#d64545 18%,transparent);color:#c43d3d}
.gs-line{margin-top:4px}.gs-small{color:var(--muted);font-size:13px}
.gs-ask{margin-top:10px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--sun) 16%,transparent);font-size:14px}
.redobox{margin-top:12px;padding:10px 12px;border:2px solid var(--e4);border-radius:10px;background:color-mix(in srgb,var(--e4) 8%,var(--surface))}
.redonote{border:2px solid var(--e4);border-radius:12px;background:color-mix(in srgb,var(--e4) 10%,var(--surface));padding:10px 14px;margin:0 0 12px;color:var(--ink)}
.redonote b{color:var(--e4)}
.redotext{margin-top:6px;font-size:17px}.redotext .redo-by{display:block;font-size:13px;color:var(--muted);margin-top:2px}
/* Wassertank */
.wtank{position:relative;display:flex;align-items:center;gap:8px;flex:1 1 280px;min-width:0;max-width:460px}
.wt-drop{width:24px;height:30px;flex:none;animation:kbounce 2.4s ease-in-out infinite}
.wt-glass{position:relative;flex:1;min-width:0;height:30px;border:2.5px solid var(--ink);border-radius:999px;background:color-mix(in srgb,var(--bg2) 60%,var(--surface));overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.08)}
.wt-water{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(180deg,#ffd27a 0%,#ff8a2b 55%,#d9561a 100%);transition:width 1.1s cubic-bezier(.3,1.2,.4,1);overflow:visible}
.wt-water::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,rgba(255,255,255,.18) 0 6px,transparent 6px 16px);animation:wtflow 1.4s linear infinite}
.wt-water::after{content:"";position:absolute;top:-4px;bottom:-4px;right:-7px;width:12px;background:radial-gradient(circle at 0 50%,#ff9a3c 5px,transparent 5.5px) 0 0/12px 10px repeat-y;animation:wtwave .9s linear infinite}
@keyframes wtflow{to{background-position:32px 0}}
@keyframes wtwave{to{background-position:0 10px}}
.wt-bub{position:absolute;bottom:-4px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.75);animation:wtbub 2.2s ease-in infinite}
.wt-bub.b1{left:15%}.wt-bub.b2{left:40%;animation-delay:.6s}.wt-bub.b3{left:65%;animation-delay:1.2s;width:3px;height:3px}.wt-bub.b4{left:85%;animation-delay:1.7s}
@keyframes wtbub{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.wt-shine{position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:999px;background:rgba(255,255,255,.45);pointer-events:none}
.wt-mark{position:absolute;top:0;bottom:0;left:var(--p);width:0;border-left:2px dashed color-mix(in srgb,var(--ink) 35%,transparent)}
.wt-mark:last-of-type{border-left:0}
.wt-mark b{position:absolute;top:50%;right:3px;transform:translateY(-50%);font-family:var(--hud);font-size:13px;font-weight:400;line-height:1;color:var(--ink);opacity:.55}
.wt-mark.done b{color:#fff;opacity:1;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.wt-num{font-family:var(--hud);font-size:22px;min-width:46px;color:var(--ink)}
.wt-num small{font-size:16px}
.wtank.wt-splash .wt-glass{animation:wtsplash .6s ease-out}
@keyframes wtsplash{30%{transform:scale(1.06,1.18)}60%{transform:scale(.98,.95)}}
.wt-plus{position:fixed;z-index:30;pointer-events:none;font-family:var(--display);font-size:16px;color:#ff8a2b;-webkit-text-stroke:1px #fff;animation:wtplus 1.3s ease-out forwards}
@keyframes wtplus{0%{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-6px) scale(1.2);opacity:1}100%{transform:translateY(-34px) scale(1);opacity:0}}
.wtank.wt-big .wt-glass{height:44px}
.wtank.wt-big .wt-drop{width:32px;height:40px}
.wtank.wt-big .wt-num{font-size:34px;min-width:70px}
.wtank.wt-big .wt-mark b{font-size:18px}
.wtank.wt-big .wt-bub{width:6px;height:6px}
@media (prefers-reduced-motion:reduce){.wt-water,.wt-water::before,.wt-water::after,.wt-bub,.wt-drop{animation:none;transition:none}}
.fenni{width:88px;height:88px}.fenni svg{width:88px;height:88px}
.f-eyes{animation:fblink 4.5s step-end infinite;transform-box:fill-box;transform-origin:center}
@keyframes fblink{0%,92%,100%{transform:scaleY(1)}94%,97%{transform:scaleY(.15)}}
.fenni.happy .f-blush{opacity:1;transition:opacity .2s}
/* senkrechter Tank */
.side-tank .wtank{height:100%}
.wtank.wt-v{flex-direction:column-reverse;align-items:center;justify-content:flex-end;max-width:none;width:100%;gap:6px;flex:none}
.wt-v .wt-glass{flex:1;width:38px;min-height:280px;max-height:520px;border-radius:20px}
.wt-v .wt-water{inset:auto 0 0 0;width:auto;height:0;transition:height 1.1s cubic-bezier(.3,1.2,.4,1);background:linear-gradient(90deg,#ffd27a 0%,#ff8a2b 55%,#d9561a 100%)}
.wt-v .wt-water::before{background:repeating-linear-gradient(30deg,rgba(255,255,255,.16) 0 6px,transparent 6px 16px);animation:wtflowv 1.6s linear infinite}
@keyframes wtflowv{to{background-position:0 -32px}}
.wt-v .wt-water::after{top:-6px;bottom:auto;left:0;right:0;width:auto;height:10px;background:radial-gradient(circle at 50% 100%,#ffd27a 5px,transparent 5.5px) 0 0/10px 10px repeat-x;animation:wtwavex 1s linear infinite}
@keyframes wtwavex{to{background-position:10px 0}}
.wt-v .wt-bub{bottom:2px;animation-name:wtbubv;animation-duration:3s}
.wt-v .wt-bub.b1{left:20%}.wt-v .wt-bub.b2{left:55%}.wt-v .wt-bub.b3{left:35%}.wt-v .wt-bub.b4{left:70%}
@keyframes wtbubv{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-140px);opacity:0}}
.wt-v .wt-shine{left:5px;right:auto;top:10px;bottom:10px;width:5px;height:auto}
.wt-v .wt-mark{left:0;right:0;top:auto;bottom:var(--p);width:auto;height:0;border-left:0;border-top:2px dashed color-mix(in srgb,var(--ink) 35%,transparent)}

 <p class="hint" style="margin:8px 0 6px">Ideen zum Antippen, oder erfindet einen eigenen Namen:</p><div class="chips">${NAMEIDEAS.map(n=>`<button class="chip ${S.group.name===n?"on":""}" data-a="gname" data-n="${n}">${n}</button>`).join("")}</div></div>
 <div class="box solid"><label>2. Eure Vornamen</label><div class="grid2">${m.map((v,i)=>`<div><label for="m${i}" class="hint" style="font-weight:400">Person ${i+1}${i>=2?" (falls ihr zu dritt oder viert seid)":""}</label><input type="text" id="m${i}" data-m="${i}" value="${esc(v)}" autocomplete="off" maxlength="20"></div>`).join("")}</div>

 <div class="row" style="margin:12px 0 18px"><button class="btn small" data-a="read">▶ Vorlesen</button><button class="btn small" data-a="stop">■ Stopp</button><span class="task">Themenheft S. 10–13</span></div>

 return head("Die Superkräfte",`Lest alle ${POWERS.length} Superkräfte.${G.level>1?" In diesem Level gibt es 3 neue!":""} Verbindet dann jedes Problem mit einer Kraft, die helfen könnte.`)+

 <h2 style="margin-top:24px">Verbindet: Was hilft gegen …?</h2><p class="hint">Tippt links auf ein Problem und dann rechts auf eine Superkraft. So zieht ihr eine Linie. Nochmals auf dieselbe Kraft tippen löst die Linie.</p>
 <div class="connect" id="connect"><svg class="clines" id="clines" aria-hidden="true"></svg>
  <div class="ccol">${OBST.map((o,i)=>`<button class="cob ${selObs===i?"sel":""} ${S.obst[i]?"linked":""}" data-a="cob" data-i="${i}"><svg class="ill" viewBox="0 0 120 70" aria-hidden="true">${ILL[OBST_ILL[i]]}</svg>${esc(o.t)}</button>`).join("")}</div>
  <div class="ccol">${POWERS.map(p=>`<button class="cpw ${Object.values(S.obst).includes(p.id)?"linked":""}" data-a="cpw" data-id="${p.id}"><svg viewBox="0 0 120 70" class="ill" aria-hidden="true">${PILL[p.id]}</svg><span>${esc(p.t)}</span></button>`).join("")}</div>
 </div>
 <div class="stack" style="gap:6px;margin-top:12px">${OBST.map((o,i)=>{const v=S.obst[i];if(!v)return"";const fit=o.fit.includes(v);

 nav(done,"Weiter","Wählt für alle vier Hindernisse eine Superkraft.");

/* ---------- Tundra: Spiellogik ---------- */
const T_TECH=[
 {id:"wider",t:"widersprechen und begründen",hint:"Das sehe ich anders, weil …",re:/(nicht einverstanden|sehe (ich )?(das )?anders|das stimmt so nicht|ja,? aber|stimmt nicht|bin dagegen|finde ich nicht|anderer meinung|glaube ich nicht|nein)/i},
 {id:"zu",t:"zustimmen und begründen",hint:"Da hast du recht, denn …",re:/(recht|stimme|sehe (ich )?(das )?auch so|sehe das auch|einverstanden|genau|finde ich auch|ich auch|gleicher meinung|stimmt)/i},
 {id:"erg",t:"wiederholen und ergänzen",hint:"Du hast gesagt, dass … Dazu möchte ich ergänzen, …",re:/(du hast gesagt|du meinst|ergänz|ausserdem|dazu möchte|noch dazu|also|dazu kommt)/i},
 {id:"frag",t:"nachfragen",hint:"Wie meinst du das?",re:/(\?|wie meinst|warum|kannst du|was meinst|weshalb|wieso)/i}
];
const TALLY=["Meinung äussern","begründen","zustimmen","widersprechen","nachfragen","ergänzen"];
const RLEN=180;
function techOk(id,t){const x=T_TECH.find(k=>k.id===id);if(!x||!t)return false;if(!x.re.test(t))return false;if(id==="wider"||id==="zu")return reasonPro(t);return true}
const hs=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%9973;return h};
const rmTotal=()=>CUR.dialog.reduce((a,l)=>a+l[1].filter(s=>typeof s!=="string").length,0);
const rmFound=()=>Object.keys(S.marks||{}).filter(k=>{const [li,si]=k.split("-").map(Number);const s=CUR.dialog[li]&&CUR.dialog[li][1][si];return s&&typeof s!=="string"}).length;
const argsTrue=()=>CUR.args.map((a,i)=>a.ok?i:-1).filter(i=>i>=0);
const argsDone=()=>argsTrue().every(i=>S.args&&S.args[i]);
const diskDone=()=>rmFound()>=rmTotal()&&argsDone();
const matchDone=()=>CUR.match.every((m,i)=>S.match&&S.match[i]===m.a);
const opOk=t=>reasonOk(t)&&reasonPro(t);
function opDoneFor(m){const o=S.op&&S.op[m];if(!o||!o.side||!opOk(o.text))return false;const techs=CUR.fit.map((f,i)=>o.fit&&o.fit[i]&&o.fit[i].tech);if(techs.some(t=>!t)||new Set(techs).size<CUR.fit.length)return false;return CUR.fit.every((f,i)=>(o.fit[i].text||"").trim().length>=15)}
const meinungDone=()=>members().length>0&&members().every(opDoneFor);
const pkSortDone=()=>CUR.pk.every((b,i)=>S.pk&&S.pk[i]===(b.pro?"pro":"kon"));
const pkDone=()=>pkSortDone()&&opOk(S.pkPro)&&opOk(S.pkKon);
function opFb(t){return !t||!t.trim()?"Noch leer.":!reasonOk(t)?"Noch etwas kurz.":reasonPro(t)?"Starke Begründung!":"Gut! Jetzt noch mit «weil» oder «denn» begründen."}
function fitClass(fx){if(!fx.tech||!(fx.text||"").trim())return "no";return techOk(fx.tech,fx.text)?"ok":"mid"}
function fitFb(fx){if(!fx.tech)return "Wähle zuerst, wie du reagierst.";const t=(fx.text||"").trim();if(t.length<15)return "Schreibe einen ganzen Satz.";return techOk(fx.tech,t)?"Passt zur gewählten Art!":"Passt das wirklich zur gewählten Art? Schau dir das Beispiel an."}
function roles(r){const m=members();if(m.length===3)return r===1?{pro:[m[0]],kon:[m[1]],obs:[m[2]]}:{pro:[m[2]],kon:[m[0]],obs:[m[1]]};
 const ev=m.filter((x,i)=>i%2===0),od=m.filter((x,i)=>i%2===1);return r===1?{pro:ev,kon:od,obs:[]}:{pro:od,kon:ev,obs:[]}}

R.diskussion=()=>{
 const tot=rmTotal(),f=rmFound();
 return head("Die Diskussion",`Drei Kinder aus dem Camp diskutieren über die Frage: «${esc(CUR.topic)}»`)+
 `<h2>1a Markiert die Redemittel</h2><p class="hint">Tippt auf alle Satzteile, die Redemittel sind. Zum Beispiel «Ich finde, dass …» oder «Wie meinst du das?».</p>
 <div class="dlg">${CUR.dialog.map(([who,segs],li)=>`<div class="dl"><b class="dl-who">${esc(who)}:</b> ${segs.map((s,si)=>{const k=li+"-"+si;const txt=typeof s==="string"?s:s.r;const hit=S.marks&&S.marks[k];return `<span class="seg ${hit?"hit":""}" role="button" tabindex="0" data-a="seg" data-k="${k}">${esc(txt)}</span>`}).join(" ")}</div>`).join("")}</div>
 <div class="row" style="margin-top:8px"><span class="dl-count ${f>=tot?"ok":""}">Gefunden: ${f} von ${tot}</span>${S.miss?`<span class="hint">Daneben getippt: ${S.miss}×</span>`:""}${f<tot?`<button class="btn small" data-a="rmtip">Tipp: Wo fehlt noch eines?</button>`:""}</div>
 <h2 style="margin-top:22px">1b Welche Argumente kommen vor?</h2><p class="hint">Tippt alle Argumente an, mit denen die drei ihre Meinung begründen. Achtung: Zwei Sätze sagt niemand!</p>
 <div class="opts">${CUR.args.map((a,i)=>{const st=S.args&&S.args[i];const tried=S.argTries&&S.argTries[i];return `<button class="opt ${st?"right":tried?"wrong":""}" data-a="arg" data-i="${i}" ${st||tried?"disabled":""}>${esc(a.t)}</button>`}).join("")}</div>
 ${argsDone()?`<div class="fb ok">Alle Argumente gefunden! +4 Wärme</div>`:""}`+
 nav(diskDone(),"Weiter",[f<tot?`Noch ${tot-f} Redemittel`:"",!argsDone()?`noch ${argsTrue().filter(i=>!(S.args&&S.args[i])).length} Argument(e)`:""].filter(Boolean).join(" und ")+" finden, dann geht es weiter.");
};
R.woerter=()=>{

 return head("Redemittel-Wörter","Tippt auf die Karten und lest, wofür man die Redemittel braucht. Sprecht die Beispiele laut aus.")+
 `<div class="grid3">${WORDS.map((w,i)=>`<button class="flip" data-a="flip" aria-label="${esc(w[0])} umdrehen"><div class="flip-in"><div class="face"><svg class="ill" viewBox="0 0 120 70" aria-hidden="true">${ILL[i]}</svg><span class="art">${esc(w[1])}</span><span class="w">${esc(w[0])}</span></div><div class="face back"><strong>${esc(w[0])}</strong>${esc(w[2])}</div></div></button>`).join("")}</div>
 <h2 style="margin-top:24px">1c Was bedeutet das Gleiche?</h2><p class="hint">Wählt zu jedem Redemittel einen Satzteil aus der Diskussion, der das Gleiche bedeutet.</p>
 <div class="stack">${CUR.match.map((m,i)=>{const v=(S.match&&S.match[i])||"";const ok=v===m.a;return `<div class="box"><p style="margin-bottom:8px"><span class="rmtag">${esc(m.rm)}</span></p><select data-match="${i}" aria-label="Passender Satzteil ${i+1}" ${ok?"disabled":""}><option value="">Satzteil aus der Diskussion wählen …</option>${opts.map(o=>`<option ${v===o?"selected":""}>${esc(o)}</option>`).join("")}</select>${v?ok?`<div class="fb ok">Passt! +1 Wärme</div>`:`<div class="fb no">Das bedeutet etwas anderes. Lest nochmals in der Diskussion nach.</div>`:""}</div>`}).join("")}</div>`+
 nav(matchDone(),"Weiter","Ordnet alle Redemittel richtig zu.");
};
const SOLVE_ORDER=["zu","wider","erg","frag"];
const SOLVE_OP="Ich finde, dass es Vorteile und Nachteile hat, weil nicht alle Kinder gleich sind.";
function solveTxt(f,id){const w=f.who;return id==="zu"?`Da hast du recht, ${w}, denn das sehe ich genauso.`:id==="wider"?`Das sehe ich anders, ${w}, weil man das nicht für alle Kinder so sagen kann.`:id==="erg"?`Du hast gesagt: «${f.t}» Dazu möchte ich ergänzen, dass es auf die Situation ankommt.`:`Wie meinst du das, ${w}? Kannst du ein Beispiel nennen?`}
function solveBox(name){S.opShow=S.opShow||{};if(!S.opShow[name])return `<div class="row" style="margin:0 0 10px"><button class="btn small" data-a="opSolve">💡 Auflösen: Musterlösung zeigen</button></div>`;
 return `<div class="box solid solvebox"><h3>💡 Musterlösung</h3><p class="hint" style="margin:0 0 8px">So könntest du reagieren. Jede Art kommt genau einmal vor. Eigene Sätze sind noch besser!</p>
 <ol class="solve-l">${CUR.fit.map((f,k)=>{const id=SOLVE_ORDER[k%4];const t=T_TECH.find(x=>x.id===id);return `<li><b>${esc(f.who)}</b> → <span class="rmtag">${esc(t.t)}</span><br>«${esc(solveTxt(f,id))}»</li>`}).join("")}</ol>
 <p class="hint" style="margin:8px 0">Deine Meinung, zum Beispiel: «${esc(SOLVE_OP)}»</p>
 <div class="row"><button class="btn small" data-a="opFill">Musterlösung einsetzen</button><button class="btn small" data-a="opSolve">Ausblenden</button><span class="hint">Eingesetzte Antworten zählen nur halb für den Tank.</span></div></div>`}
R.meinung=()=>{

  `<div class="grid2">${ms.map((m,k)=>`<div class="box solid"><h3>${esc(m)}</h3><p class="hint" style="margin:0">Meinung begründet und auf 4 Beiträge reagiert.</p><button class="btn small" style="margin-top:8px" data-a="opRedo" data-k="${k}">${esc(m)} ändert noch etwas</button></div>`).join("")}</div>`+nav(true)}

 if(S.opCover!==false){return `<div class="cover"><div class="eyebrow" style="color:var(--sun)">Stufe 2 · Einzelarbeit</div><h2>${esc(name)} ist dran!</h2><p style="margin-inline:auto">Die anderen schauen weg und überlegen sich schon ihre eigene Meinung. Nicht spicken!</p><button class="btn primary" data-a="opUncover" style="--ec:var(--e2)">Ich bin ${esc(name)}, los!</button></div>`+nav(false,"Weiter","")}
 S.op=S.op||{};const o=S.op[name]||(S.op[name]={side:"",text:"",fit:{}});o.fit=o.fit||{};
 const done=opDoneFor(name);
 const used=CUR.fit.map((f,k)=>o.fit[k]&&o.fit[k].tech).filter(Boolean);
 return head(`${esc(name)}: Deine Meinung`,"Arbeite allein. Es gibt kein Richtig und Falsch, aber eine gute Begründung zählt!")+
 `<div class="box solid"><h3>Aufgabe 2: ${esc(CUR.topic)}</h3>
 <div class="chips" style="margin:6px 0 10px">${["Ich bin dafür","Ich bin dagegen","Teils, teils"].map(sd=>`<button class="chip ${o.side===sd?"on":""}" data-a="opside" data-s="${sd}">${sd}</button>`).join("")}</div>
 <label for="op_text">Schreibe deine Meinung auf und begründe sie.</label>
 <div class="chips" style="margin-bottom:8px">${["Ich finde, dass …","Meiner Meinung nach …","Ich bin dafür, weil …","Ich bin dagegen, denn …","Ein Grund dafür ist, …"].map(s=>`<button class="chip" data-a="ins" data-t="op_text" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
 <textarea id="op_text" data-op placeholder="Meiner Meinung nach …, weil …">${esc(o.text)}</textarea>
 <div class="fb ${opOk(o.text)?"ok":"no"}" id="op_fb">${opFb(o.text)}</div></div>
 <h2 style="margin-top:22px">B1 Geh auf die Beiträge ein</h2><p class="hint">Reagiere auf jeden Beitrag auf eine andere Art: widersprechen, zustimmen, wiederholen und ergänzen, nachfragen. Jede Art genau einmal!</p>${solveBox(name)}
 <div class="stack">${CUR.fit.map((f,k)=>{const fx=o.fit[k]||{};const tt=T_TECH.find(x=>x.id===fx.tech);return `<div class="box solid fitbox"><div class="fit-say"><b>${esc(f.who)}:</b> «${esc(f.t)}»</div>

  ${tt?`<p class="hint" style="margin:6px 0">Zum Beispiel: «${esc(tt.hint)}»</p>`:""}
  <textarea data-fitt="${k}" aria-label="Antwort an ${esc(f.who)}" placeholder="Meine Antwort an ${esc(f.who)} …" ${fx.tech?"":"disabled"}>${esc(fx.text||"")}</textarea>
  <div class="fb ${fitClass(fx)}" data-fitfb="${k}">${fitFb(fx)}</div></div>`}).join("")}</div>`+
 `<div class="nav"><button class="btn" data-a="back">Zurück</button><span class="hint">${done?"":"Seite wählen, Meinung mit «weil» begründen und auf alle vier Beiträge reagieren."}</span><button class="btn primary" data-a="opDone" ${done?"":"disabled"}>Fertig, iPad weitergeben</button></div>`;
};

function gateSummary(n){
 const rows=[];let ask="";
 if(n===1){
  const tries=QUIZ.map((q,i)=>(S.quizTries[i]||[]).filter(j=>j!==q.r).length);const wrong=tries.reduce((a,b)=>a+b,0);
  rows.push(["Funkspruch-Fragen",chip(wrong===0?true:wrong<=2?null:false,wrong===0?"alle beim 1. Versuch":`${wrong} Fehlversuch${wrong>1?"e":""}`)]);
  rows.push(["Redemittel markiert",chip(rmFound()>=rmTotal(),`${rmFound()} von ${rmTotal()}`)+(S.miss?` <span class="gs-small">${S.miss}× daneben getippt</span>`:"")+(S.rmTips?` <span class="gs-small">${S.rmTips} Tipp${S.rmTips>1?"s":""} benutzt</span>`:"")]);
  const wrongA=CUR.args.filter((a,i)=>!a.ok&&S.argTries&&S.argTries[i]).length;
  rows.push(["Argumente gefunden",chip(argsDone()?(wrongA?null:true):false,argsDone()?"alle gefunden":"unvollständig")+(wrongA?` <span class="gs-small">${wrongA} falsche gewählt</span>`:"")]);
  rows.push(["Redemittel zugeordnet (1c)",chip(matchDone(),`${CUR.match.filter((m,i)=>S.match&&S.match[i]===m.a).length} von ${CUR.match.length}`)]);
  ask="Nennt mir ein Redemittel zum Widersprechen und eines zum Nachfragen.";
 }
 if(n===2){
  members().forEach(m=>{const o=S.op&&S.op[m];if(!o){rows.push([esc(m),chip(false,"noch nichts")]);return}
   const tok=CUR.fit.filter((f,k)=>o.fit&&o.fit[k]&&techOk(o.fit[k].tech,o.fit[k].text)).length;
   rows.push([esc(m),`${chip(null,esc(o.side||"–"))} ${chip(reasonPro(o.text),reasonPro(o.text)?"mit weil/denn":"ohne weil/denn")} ${chip(tok===CUR.fit.length?true:tok>=2?null:false,`${tok}/${CUR.fit.length} Reaktionen passen`)}<div class="gs-line"><span class="gs-small">${esc(o.text)}</span></div>${CUR.fit.map((f,k)=>{const fx=(o.fit&&o.fit[k])||{};const tt=T_TECH.find(x=>x.id===fx.tech);return `<div class="gs-line"><b>${tt?tt.t:"–"}:</b> <span class="gs-small">${esc(fx.text||"–")}</span></div>`}).join("")}`]);
  });

 if(n===3){

  rows.push(["Pro/Kontra sortiert",chip(ok===CUR.pk.length,`${ok} von ${CUR.pk.length}`)]);
  rows.push(["Eigene Argumente",`<div class="gs-line"><b>Pro:</b> <span class="gs-small">${esc(S.pkPro||"–")}</span></div><div class="gs-line"><b>Kontra:</b> <span class="gs-small">${esc(S.pkKon||"–")}</span></div>`]);
  rows.push(["Aufnahme",chip(!!S.rec,S.rec?"Aufnahme lief":"nicht bestätigt")]);
  rows.push(["Runden",`${chip(!!S.r1Done,"Runde 1: "+(S.r1Dur?mmss(S.r1Dur):"–"))} ${chip(!!S.r2Done,"Runde 2: "+(S.r2Dur?mmss(S.r2Dur):"–"))}`+(S.skipped?` <span class="gs-small">(Timer übersprungen)</span>`:"")]);

  rows.push(["Strichliste",chip(tot>=10?true:tot>=4?null:false,`${tot} Redemittel`)+`<div class="gs-line gs-small">${tl.map(([t,c])=>`${t}: ${c}`).join(" · ")}</div>`]);
  ask="Welches Argument der Gegenseite war am stärksten? Warum?";
 }
 if(S.redo&&S.redo[n])rows.unshift(["Wiederholt",chip(null,`${S.redo[n]}×`)]);
 return `<div class="gsum"><div class="gs-h">Für die Lehrperson: So hat die Gruppe gearbeitet</div><div class="gs-name">${esc(S.group.name||"")} · ${esc(members().join(", "))} · Level ${G.level}</div>

 ${ask?`<div class="gs-ask"><b>Kontrollfrage:</b> ${ask}</div>`:""}</div>`;
}

  return}
 if(a==="uncover"){S.wahlCover=false;save();render();say(TIPS.wahl);return}

  save();render();return}
 if(a==="ins"){const t=document.getElementById(b.dataset.t);const s=b.dataset.s.replace(/^…,?\s*/,"").replace(/\s*…$/," ");t.value=(t.value.trim()?t.value.trim()+" ":"")+s;t.focus();t.dispatchEvent(new Event("input",{bubbles:true}));return}
 if(a==="wahlDone"){sfx("good");S.wahlIdx++;S.wahlCover=true;save();render();hop();say(S.wahlIdx>=members().length?"Alle sind fertig. Super!":"Sehr gut! Gib das iPad weiter.");return}
 if(a==="redo"){S.wahlIdx=+b.dataset.k;S.wahlCover=true;save();render();return}
 if(a==="spick"){S.spickOpen=b.dataset.m||null;save();render();return}
 if(a==="tstart"){S.timerStart=Date.now();save();render();say("Los geht's! Jede Person stellt zuerst ihre Wahl vor.");return}
 if(a==="tstop"){sfx("good");S.timerDone=true;S.timerEnd=Date.now();save();render();hop();return}
 if(a==="spk"){const key=b.dataset.k;S.revealed=S.revealed||{};const o=!S.revealed[key];S.revealed[key]=o;save();const [m,k]=[key.slice(0,key.lastIndexOf("|")),+key.slice(key.lastIndexOf("|")+1)];b.classList.toggle("open",o);b.setAttribute("aria-pressed",o);b.innerHTML=spkInner(m,k,o);b.classList.remove("flipin");void b.offsetWidth;b.classList.add("flipin");sfx(o?"pop":"back");return}
 if(a==="tskip"){sfx("good");S.timerDone=true;S.skipped=true;S.timerEnd=Date.now();if(!S.timerStart)S.timerStart=Date.now();clearInterval(tick);save();render();hop();say("Erledigt! Weiter zur Einigung.");return}
 if(a==="agree"){const id=b.dataset.id;const r=S.agreed.indexOf(id);if(r>=0)S.agreed.splice(r,1);else if(S.agreed.length<3)S.agreed.push(id);else{say("Ihr habt schon drei gewählt.");return}save();render();return}
 if(a==="how"){S.howAgree=b.dataset.h;save();render();return}
 if(a==="rate"){S.rating[b.dataset.i]=+b.dataset.j;save();render();return}
 if(a==="copy"){const txt=summary();const fb=()=>{const r=document.createRange();r.selectNodeContents($("#sum"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Text markiert. Jetzt «Kopieren» tippen.")};
  sfx("select");try{navigator.clipboard.writeText(txt).then(()=>toast("Kopiert!"),fb)}catch(e){fb()}return}
});
document.addEventListener("input",ev=>{
 const t=ev.target;

 if(t.dataset.gname!=null){S.group.name=t.value;save();const nb=$("[data-a=next]");if(nb)nb.disabled=!startOk();document.querySelectorAll("[data-a=gname]").forEach(c=>c.classList.toggle("on",c.dataset.n===t.value));renderHud();return}
 if(t.dataset.why){const name=members()[S.wahlIdx];S.picks[name].why[t.dataset.why]=t.value;save();

 if(t.dataset.ag){S.agreedWhy[t.dataset.ag]=t.value;save();updNext(R_OK.einigung());return}

 if(t.dataset.tip!=null){S.tips[+t.dataset.tip]=t.value;save();updNext(R_OK.tipps());return}
});
const R_OK={einigung:()=>true,
 hoeren:()=>S.heard&&KRIT.every((k,i)=>S.rating[i]!=null)&&S.good.trim().length>10&&S.better.trim().length>10,

document.addEventListener("change",ev=>{
 const t=ev.target;
 if(t.dataset.f==="nr"){S.group.nr=t.value;save();render();return}
 if(t.dataset.gap!=null){S.gaps[t.dataset.gap]=t.value;sfx(t.value===GAPS[+t.dataset.gap][1]?"good":"bad");save();render();if(t.value===GAPS[+t.dataset.gap][1])hop();return}
 if(t.dataset.obst!=null){S.obst[t.dataset.obst]=t.value;save();render();return}
 if(t.id==="rec"){S.rec=t.checked;save();render();return}
 if(t.id==="heard"){S.heard=t.checked;save();render();return}
});
