<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web-App-Galerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F1A3A; --muted:#5B5578; --bg1:#FFF8EE; --bg2:#F1EEFF;
  --card:#FFFFFF; --shadow:0 10px 30px rgba(40,30,90,.12);
}
*{box-sizing:border-box}
html{font-size:clamp(15px,1.05vw,19px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito",system-ui,sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}

/* schwebende Formen im Hintergrund */
.bgshapes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bgshapes span{position:absolute;border-radius:50%;opacity:.35;filter:blur(2px);animation:drift 20s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}}

.wrap{position:relative;z-index:1;max-width:84rem;margin:0 auto;padding:2.2rem 1.4rem 4rem}
header{text-align:center;margin-bottom:2.2rem}
.badge{display:inline-flex;gap:.5rem;align-items:center;background:#fff;border-radius:999px;padding:.4rem 1rem;
  font-weight:800;box-shadow:var(--shadow);font-size:.95rem}
h1{font-family:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;font-weight:700;font-size:clamp(2.4rem,5.5vw,4.4rem);margin:.8rem 0 .3rem;line-height:1.05;letter-spacing:-.01em}
h1 .w{display:inline-block;animation:wave 3.2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-.12em)}}
h1 .rb{background:linear-gradient(90deg,#E3000F,#FF7EB6,#8B5CFF,#1E88C7,#20A386,#FFC21A);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.lead{color:var(--muted);font-size:1.15rem;font-weight:700;margin:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));gap:1.6rem}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--card);
  border-radius:28px;overflow:hidden;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .3s;
  animation:tileIn .7s cubic-bezier(.3,1.4,.5,1) both;position:relative}
.tile:hover,.tile:focus-visible{transform:translateY(-8px) rotate(-.6deg);box-shadow:0 22px 44px rgba(40,30,90,.22)}
.tile:nth-child(even):hover{transform:translateY(-8px) rotate(.6deg)}
.tile:focus-visible{outline:4px solid var(--c);outline-offset:4px}
.tile:active{transform:scale(.97)}
@keyframes tileIn{from{opacity:0;transform:translateY(40px) scale(.94)}}
.scene{aspect-ratio:16/10;width:100%;display:block;position:relative;overflow:hidden}
.scene svg{width:100%;height:100%;display:block}
.num{position:absolute;top:.8rem;left:.8rem;background:rgba(255,255,255,.92);color:var(--ink);font-family:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;font-weight:700;
  border-radius:999px;padding:.25rem .8rem;font-size:.9rem;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.info{padding:1.1rem 1.3rem 1.3rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.info h2{font-family:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;font-weight:700;font-size:1.65rem;margin:0;color:var(--c)}
.info p{margin:0;color:var(--muted);font-weight:700;line-height:1.4}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.2rem}
.tags span{background:var(--soft);color:var(--c);border-radius:999px;padding:.18rem .7rem;font-size:.85rem;font-weight:800}
.go{margin-top:auto;padding-top:.6rem;display:flex;justify-content:flex-end}
.go span{background:var(--c);color:#fff;border-radius:999px;padding:.6rem 1.3rem;font-weight:800;font-size:1.05rem;
  display:inline-flex;gap:.5rem;align-items:center;transition:transform .2s}
.tile:hover .go span{transform:scale(1.07)}
.go b{display:inline-block;transition:transform .25s}
.tile:hover .go b{transform:translateX(4px)}

/* ---------- App-Fenster ---------- */
#player{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:#fff}
#player.open{display:flex;animation:openP .45s cubic-bezier(.3,1.2,.5,1)}
@keyframes openP{from{clip-path:circle(0% at var(--ox,50%) var(--oy,50%))}to{clip-path:circle(150% at var(--ox,50%) var(--oy,50%))}}
.bar{display:flex;align-items:center;gap:.8rem;padding:.5rem .8rem;background:var(--c,#333);color:#fff;flex:none}
.bar button{border:none;border-radius:999px;padding:.5rem 1rem;font-weight:800;background:rgba(255,255,255,.22);color:#fff}
.bar button:hover{background:rgba(255,255,255,.35)}
.bar .t{font-family:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;font-weight:600;font-size:1.15rem;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#frame{flex:1;border:none;width:100%;background:#fff}
#curtain{position:absolute;inset:3.1rem 0 0 0;display:grid;place-items:center;background:var(--c);color:#fff;transition:opacity .5s;text-align:center}
#curtain.hide{opacity:0;pointer-events:none}
#curtain .big{font-size:5rem;animation:bounce .8s ease-in-out infinite}
#curtain .name{font-family:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;font-size:2.2rem;font-weight:700}
@keyframes bounce{50%{transform:translateY(-18px) scale(1.08)}}

footer{text-align:center;color:var(--muted);font-weight:700;margin-top:2.5rem;font-size:.95rem}

/* ---------- Szenen-Animationen ---------- */
.tw{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* 1 Brain-Quiz */
.jumper{animation:jump 4.8s ease-in-out infinite}
@keyframes jump{
  0%,6%{transform:translate(0,0)} 14%{transform:translate(60px,-62px)} 22%,30%{transform:translate(120px,0)}
  38%{transform:translate(180px,-62px)} 46%,54%{transform:translate(240px,0)}
  62%{transform:translate(180px,-62px)} 70%,78%{transform:translate(120px,0)}
  86%{transform:translate(60px,-62px)} 94%,100%{transform:translate(0,0)}}
.plat{transform-box:fill-box;transform-origin:center;animation:plat 4.8s ease-in-out infinite}
@keyframes plat{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.right{animation:right 4.8s steps(1) infinite}
@keyframes right{0%,21%{fill:#1E88C7}22%,30%{fill:#3BE3A0}31%,100%{fill:#1E88C7}}

/* 2 Schweizer-Boss */
.flag{transform-box:fill-box;transform-origin:left center;animation:flag 1.6s ease-in-out infinite}
@keyframes flag{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-6deg) scaleX(.94)}}
.cow{animation:cow 7s ease-in-out infinite}
@keyframes cow{0%,100%{transform:translate(0,0)}45%{transform:translate(70px,0)}50%{transform:translate(70px,-6px)}55%{transform:translate(70px,0)}}
.leg{transform-box:fill-box;transform-origin:top center;animation:leg .5s ease-in-out infinite alternate}
.leg.b{animation-delay:-.25s}
@keyframes leg{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.dice{transform-box:fill-box;transform-origin:center;animation:dice 3.2s cubic-bezier(.3,1.5,.5,1) infinite}
@keyframes dice{0%{transform:translateY(-60px) rotate(0)}30%{transform:translateY(0) rotate(360deg)}38%{transform:translateY(-12px) rotate(380deg)}45%,100%{transform:translateY(0) rotate(360deg)}}
.crown{animation:crown 2.4s ease-in-out infinite}
@keyframes crown{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(5deg)}}
.cloud{animation:cloud 18s linear infinite}
@keyframes cloud{from{transform:translateX(-80px)}to{transform:translateX(460px)}}

/* 3 Team-Boss */
.swapA{animation:swapA 5s ease-in-out infinite}
@keyframes swapA{0%,25%{transform:translate(0,0)}45%,75%{transform:translate(220px,-50px)}95%,100%{transform:translate(0,0)}}
.swapB{animation:swapB 5s ease-in-out infinite}
@keyframes swapB{0%,25%{transform:translate(0,0)}45%,75%{transform:translate(-220px,50px)}95%,100%{transform:translate(0,0)}}
.trophy{transform-box:fill-box;transform-origin:bottom center;animation:troph 2.4s ease-in-out infinite}
@keyframes troph{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.06)}}
.wing{transform-box:fill-box;transform-origin:center;animation:flap .12s linear infinite alternate}
@keyframes flap{to{transform:scaleY(.4)}}

/* 4 Glitch, Plan */
.gl-float{animation:bob 3.2s ease-in-out infinite}
.gbar{animation:gbar 2.6s steps(1) infinite}
@keyframes gbar{0%,100%{opacity:0}8%{opacity:.9;transform:translateX(6px)}12%{opacity:0}55%{opacity:.8;transform:translateX(-8px)}60%{opacity:0}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.chk{transform-box:fill-box;transform-origin:center;animation:chk 6s ease-out infinite}
@keyframes chk{0%{transform:scale(0)}6%{transform:scale(1.4)}10%,88%{transform:scale(1)}94%,100%{transform:scale(0)}}
.prog{animation:prog 6s ease-out infinite}
@keyframes prog{0%{width:0}75%,90%{width:154px}100%{width:0}}

/* 5 Lern World */
.vxdrop{animation:vxdrop 3.6s cubic-bezier(.5,0,.7,1) infinite}
@keyframes vxdrop{0%{transform:translateY(-90px);opacity:0}8%{opacity:1}35%{transform:translateY(0)}40%{transform:translateY(-6px)}45%,85%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.vxcoin{animation:vxcoin 3.6s ease-out infinite}
@keyframes vxcoin{0%,40%{transform:translateY(10px);opacity:0}50%{opacity:1}85%{transform:translateY(-14px);opacity:1}100%{transform:translateY(-20px);opacity:0}}
.vxkid{animation:vxkid .9s steps(2) infinite}
@keyframes vxkid{50%{transform:translateY(-2px)}}
.vxarm{transform-box:fill-box;transform-origin:top center;animation:vxarm 3.6s ease-in-out infinite}
@keyframes vxarm{0%,20%{transform:rotate(0)}30%{transform:rotate(-70deg)}40%,100%{transform:rotate(0)}}

/* 6 Schlaue Köpfchen */
.front{transform-box:fill-box;transform-origin:center;animation:front 6s ease-in-out infinite}
@keyframes front{0%,42%{transform:scaleX(1)}47%,95%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.back{transform-box:fill-box;transform-origin:center;animation:back 6s ease-in-out infinite}
@keyframes back{0%,47%{transform:scaleX(0)}52%,90%{transform:scaleX(1)}95%,100%{transform:scaleX(0)}}
.paw{transform-box:view-box;transform-origin:84px 100px;animation:paw 2.4s ease-in-out infinite}
@keyframes paw{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-16deg)}80%{transform:rotate(8deg)}90%{transform:rotate(-12deg)}}
.float{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bgshapes" aria-hidden="true">
  <span style="width:22rem;height:22rem;background:#FFD6E8;top:-6rem;left:-5rem"></span>
  <span style="width:16rem;height:16rem;background:#C9F0E2;top:40%;right:-5rem;animation-delay:-5s"></span>
  <span style="width:18rem;height:18rem;background:#D9CCFF;bottom:-6rem;left:30%;animation-delay:-10s"></span>
  <span style="width:9rem;height:9rem;background:#FFE7A3;top:18%;left:55%;animation-delay:-3s"></span>
</div>

<div class="wrap">
  <header>
    <div class="badge">🎓 Klasse 6i · 6 Gruppen · 6 Apps</div>
    <h1><span class="rb">Unsere Web-Apps</span> <span class="w">🚀</span></h1>
    <p class="lead">Tippe auf eine Gruppe – dann startet ihre App!</p>
  </header>

  <main class="grid" id="grid"></main>
  <footer>Gemacht mit viel Fantasie von der Klasse 6i 💛</footer>
</div>

<div id="player" aria-modal="true" role="dialog" aria-label="App">
  <div class="bar">
    <button id="backBtn">⬅ Zur Galerie</button>
    <div class="t" id="pTitle"></div>
    <button id="fsBtn" title="Ganzer Bildschirm">⛶ Vollbild</button>
  </div>
  <iframe id="frame" title="App der Gruppe"></iframe>
  <div id="curtain"><div><div class="big" id="cEmoji"></div><div class="name" id="cName"></div><div>wird gestartet …</div></div></div>
</div>

<script>
/* ================= Szenen ================= */
function stars(n, w, h, color){
  let s='';
  for(let i=0;i<n;i++){
    const x=(Math.random()*w).toFixed(0), y=(Math.random()*h).toFixed(0), r=(Math.random()*1.6+.6).toFixed(1);
    s+=`<circle class="tw" cx="${x}" cy="${y}" r="${r}" fill="${color}" style="animation-delay:-${(Math.random()*3).toFixed(1)}s"/>`;
  }
  return s;
}

const SCENES = {
/* ---------- 1 Brain-Quiz: Weltraum-Obby ---------- */
1: () => `<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="s1sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071640"/><stop offset="1" stop-color="#1E4FA0"/></linearGradient>
  <linearGradient id="s1pl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5CC6E8"/><stop offset="1" stop-color="#0B4F8A"/></linearGradient></defs>
  <rect width="400" height="250" fill="url(#s1sky)"/>
  ${stars(45,400,200,'#fff')}
  <g class="bob" style="animation-duration:5s">
    <circle cx="335" cy="58" r="24" fill="#FFC21A"/><circle cx="327" cy="50" r="5" fill="#FFE27A"/><circle cx="343" cy="66" r="3.5" fill="#E8A800"/>
    <ellipse cx="335" cy="58" rx="40" ry="9" fill="none" stroke="#FF7A9C" stroke-width="4" transform="rotate(-18 335 58)"/>
  </g>
  <g class="pulse"><rect x="120" y="22" width="160" height="42" rx="14" fill="#fff"/><text x="200" y="51" text-anchor="middle" font-family="Fredoka, Nunito, ui-rounded, system-ui, sans-serif" font-weight="700" font-size="22" fill="#0B4F8A">7 · 8 = ?</text></g>
  <g font-family="Fredoka, Nunito, ui-rounded, system-ui, sans-serif" font-weight="700" font-size="17" fill="#fff" text-anchor="middle">
    <g class="plat"><rect x="40" y="196" width="80" height="22" rx="8" fill="url(#s1pl)"/><text x="80" y="213">54</text></g>
    <g class="plat" style="animation-delay:-1.2s"><rect class="right" x="160" y="196" width="80" height="22" rx="8" fill="#1E88C7"/><text x="200" y="213">56</text></g>
    <g class="plat" style="animation-delay:-2.4s"><rect x="280" y="196" width="80" height="22" rx="8" fill="url(#s1pl)"/><text x="320" y="213">48</text></g>
  </g>
  <g class="jumper"><g transform="translate(80 172)">
    <circle r="22" fill="rgba(189,235,245,.25)" stroke="#BDEBF5" stroke-width="3"/>
    <g fill="#FF8FB0"><circle cx="-8" cy="-4" r="9"/><circle cx="6" cy="-6" r="10"/><circle cx="-2" cy="5" r="10"/><circle cx="9" cy="4" r="8"/></g>
    <path d="M-10 -4 q4 -4 8 0 M2 -9 q4 3 8 0" stroke="#E0567F" stroke-width="1.6" fill="none"/>
    <circle cx="-5" cy="2" r="3.2" fill="#fff"/><circle cx="5" cy="2" r="3.2" fill="#fff"/>
    <circle cx="-4.4" cy="2.6" r="1.6" fill="#1F1A3A"/><circle cx="5.6" cy="2.6" r="1.6" fill="#1F1A3A"/>
    <path d="M-4 9 q4 3.5 8 0" stroke="#1F1A3A" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M-10 -20 l-4 -8 M10 -20 l4 -8" stroke="#BDEBF5" stroke-width="2"/><circle cx="-14" cy="-29" r="2.6" fill="#FFC21A"/><circle cx="14" cy="-29" r="2.6" fill="#FFC21A"/>
  </g></g>
  <g fill="#FFC21A" font-size="16"><text x="22" y="40" class="tw">⭐</text><text x="365" y="150" class="tw" style="animation-delay:-1s">⭐</text></g>
</svg>`,

/* ---------- 2 Schweizer-Boss: Alpen-Leiterspiel ---------- */
2: () => `<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="s2sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FC4FF"/><stop offset="1" stop-color="#E6F5FF"/></linearGradient></defs>
  <rect width="400" height="250" fill="url(#s2sky)"/>
  <circle cx="60" cy="48" r="22" fill="#FFE08A" class="pulse"/>
  <g class="cloud" fill="#fff" opacity=".9"><ellipse cx="0" cy="40" rx="28" ry="11"/><ellipse cx="18" cy="32" rx="18" ry="12"/></g>
  <g class="cloud" fill="#fff" opacity=".8" style="animation-delay:-9s"><ellipse cx="0" cy="70" rx="22" ry="9"/><ellipse cx="14" cy="63" rx="14" ry="10"/></g>
  <polygon points="40,190 140,70 240,190" fill="#8A97A8"/><polygon points="140,70 118,96 128,92 140,102 152,92 162,96" fill="#fff"/>
  <polygon points="170,190 270,58 380,190" fill="#6F7E92"/><polygon points="270,58 246,88 258,84 270,96 284,84 296,90" fill="#fff"/>
  <path d="M0 180 Q100 160 200 178 T400 172 V250 H0Z" fill="#6CC24A"/>
  <path d="M0 205 Q120 190 240 206 T400 200 V250 H0Z" fill="#4FA83A"/>
  <g transform="translate(312 92)">
    <rect x="0" y="0" width="5" height="110" fill="#8B5A2B"/>
    <rect x="0" y="0" width="5" height="110" fill="#8B5A2B" transform="translate(26 0)"/>
    ${[12,32,52,72,92].map(y=>`<rect x="0" y="${y}" width="31" height="4" fill="#A9733A"/>`).join('')}
    <g class="crown"><path d="M2 -14 L6 -32 L12 -22 L16 -36 L20 -22 L26 -32 L30 -14Z" fill="#FFD43B" stroke="#B47A00" stroke-width="2" stroke-linejoin="round"/><circle cx="16" cy="-24" r="2.4" fill="#E3000F"/></g>
  </g>
  <g transform="translate(24 120)"><rect x="0" y="0" width="3.5" height="70" fill="#555"/>
    <g class="flag"><rect x="3.5" y="0" width="36" height="36" fill="#E3000F"/><rect x="17.5" y="7" width="8" height="22" fill="#fff"/><rect x="10.5" y="14" width="22" height="8" fill="#fff"/></g></g>
  <g class="cow"><g transform="translate(110 186)">
    <rect class="leg" x="-22" y="8" width="7" height="22" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect class="leg b" x="-10" y="8" width="7" height="22" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect class="leg b" x="8" y="8" width="7" height="22" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect class="leg" x="20" y="8" width="7" height="22" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <ellipse cx="2" cy="0" rx="36" ry="20" fill="#fff" stroke="#333" stroke-width="2"/>
    <path d="M-20 -12 q10 -6 14 4 q-2 10 -14 6z" fill="#3A2A20"/><path d="M8 4 q10 -4 14 6 q-6 8 -16 2z" fill="#3A2A20"/>
    <path d="M-34 -4 q-10 4 -8 16" stroke="#333" stroke-width="2" fill="none"/>
    <g transform="translate(40 -14)">
      <path d="M-8 -14 q-6 -6 -2 -12 M8 -14 q6 -6 2 -12" stroke="#E9D9B0" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="0" cy="0" rx="16" ry="18" fill="#fff" stroke="#333" stroke-width="2"/>
      <ellipse cx="0" cy="10" rx="12" ry="8" fill="#F7B8CB"/><circle cx="-4" cy="10" r="1.6" fill="#7A3A4F"/><circle cx="4" cy="10" r="1.6" fill="#7A3A4F"/>
      <circle cx="-6" cy="-4" r="2.6" fill="#1F1A3A"/><circle cx="6" cy="-4" r="2.6" fill="#1F1A3A"/>
      <path d="M-6 18 q6 6 12 0" fill="#FFC21A" stroke="#B47A00" stroke-width="1.5"/>
    </g>
  </g></g>
  <g transform="translate(220 200)"><g class="dice"><rect x="-15" y="-15" width="30" height="30" rx="7" fill="#E3000F"/>
    <g fill="#fff"><circle cx="-7" cy="-7" r="3"/><circle cx="7" cy="7" r="3"/><circle cx="0" cy="0" r="3"/><circle cx="7" cy="-7" r="3"/><circle cx="-7" cy="7" r="3"/></g></g></g>
</svg>`,

/* ---------- 3 Team-Boss: faire Teams mit Lilo ---------- */
3: () => {
  const kid = (x,y,c,face=true) => `<g transform="translate(${x} ${y})"><circle r="13" fill="${c}"/>${face?'<circle cx="-4" cy="-2" r="1.8" fill="#1F1A3A"/><circle cx="4" cy="-2" r="1.8" fill="#1F1A3A"/><path d="M-4 4 q4 3.5 8 0" stroke="#1F1A3A" stroke-width="1.6" fill="none" stroke-linecap="round"/>':''}</g>`;

/* ---------- 5 Lern World: Klötzchen-Welt ---------- */
5: () => {
  // kleiner Zufallsgenerator, damit die Pixel immer gleich aussehen
  let sd = 7; const R = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  const cl = v => Math.max(0, Math.min(255, Math.round(v)));
  const rgb = (r,g,b) => `rgb(${cl(r)},${cl(g)},${cl(b)})`;
  const pat = (id, fn) => { let s = `<pattern id="vx-${id}" width="16" height="16" patternUnits="userSpaceOnUse">`;
    for(let y=0;y<8;y++) for(let x=0;x<8;x++){ const c = fn(x,y); if(c) s += `<rect x="${x*2}" y="${y*2}" width="2.05" height="2.05" fill="${c}"/>`; }
    return s + '</pattern>'; };
  const n = (r,g,b,a) => { const v=(R()-.5)*2*a; return rgb(r+v,g+v,b+v); };
  const dirt = () => R()<.15 ? rgb(100,70,48) : n(134,96,67,14);
  const P = [
    pat('gt', () => R()<.2 ? rgb(72,140,46) : n(96,168,62,18)),
    pat('gs', (x,y) => y < 2 + (R()<.4?1:0) ? n(96,168,62,16) : dirt()),
    pat('d',  () => dirt()),
    pat('st', () => R()<.18 ? rgb(100,100,104) : n(128,128,132,10)),
    pat('sa', () => n(220,208,160,9)),
    pat('wa', (x,y) => ((x+y*2)%5===0) ? rgb(110,175,240) : n(52,120,215,10)),
    pat('ls', (x) => x%2===0 ? n(88,64,36,8) : n(112,84,52,10)),
    pat('lv', () => R()<.15 ? rgb(40,110,34) : n(58,138,44,22)),
    pat('pl', (x,y) => y%2===1 && (x+Math.floor(y/2)*3)%8===0 ? rgb(120,92,56) : (y%2===1 ? n(150,116,70,8) : n(172,136,86,10))),
    pat('br', (x,y) => (y%2===1 || (Math.floor(y/2)%2 ? x%4===1 : x%4===3)) ? rgb(190,180,170) : n(168,72,58,14)),
    pat('rf', (x,y) => y%2===1 ? n(150,40,48,8) : n(200,60,70,12)),
    pat('pk', () => R()<.12 ? rgb(255,255,255) : n(255,150,200,12)),
  ].join('');
  const T = {grass:['gt','gs','gs'], dirt:['d','d','d'], stone:['st','st','st'], sand:['sa','sa','sa'], water:['wa','wa','wa'],
    log:['d','ls','ls'], leaves:['lv','lv','lv'], planks:['pl','pl','pl'], brick:['br','br','br'], roof:['rf','rf','rf'], pink:['pk','pk','pk']};
  const DX=15.6, DY=9, DZ=18, OX=200, OY=80;
  const pt = (x,y,h) => [OX + (x-y)*DX, OY + (x+y)*DY - h*DZ];
  const cube = (x,y,z,t,extra='') => { const [top,side1,side2] = T[t]; const k=DX/16, j=DY/16, m=DZ/16;
    const [ax,ay]=pt(x,y,z+1), [bx,by]=pt(x,y+1,z+1), [cx,cy]=pt(x+1,y,z+1);
    return `<g ${extra}>
      <g transform="matrix(${k} ${j} ${-k} ${j} ${ax} ${ay})"><rect width="16" height="16" fill="url(#vx-${top})"/></g>
      <g transform="matrix(${k} ${j} 0 ${m} ${bx} ${by})"><rect width="16" height="16" fill="url(#vx-${side1})"/><rect width="16" height="16" fill="#000" opacity=".16"/></g>
      <g transform="matrix(${-k} ${j} 0 ${m} ${cx} ${cy})"><rect width="16" height="16" fill="url(#vx-${side2})"/><rect width="16" height="16" fill="#000" opacity=".32"/></g></g>`; };
  // Welt bauen
  const B = [];
  const water = new Set(['0,4','0,5','1,5']), sand = new Set(['1,4','0,3','2,5','1,3']);
  for(let x=0;x<6;x++) for(let y=0;y<6;y++){
    if(x===5||y===5) B.push([x,y,-1,'dirt']);
    if(x===5&&y===5) B.push([x,y,-2,'stone']);
    const k=x+','+y; B.push([x,y,0, water.has(k)?'water':sand.has(k)?'sand':'grass']);
  }
  B.push([1,1,1,'log'],[1,1,2,'log']);
  for(let x=0;x<3;x++) for(let y=0;y<3;y++) B.push([x,y,3,'leaves']);
  B.push([1,1,4,'leaves']);
  B.push([4,0,1,'brick'],[5,0,1,'brick'],[4,1,1,'brick'],[5,1,1,'brick'],[4,0,2,'planks'],[5,0,2,'planks'],[4,1,2,'planks'],[5,1,2,'planks'],[4,0,3,'roof'],[5,0,3,'roof'],[4,1,3,'roof'],[5,1,3,'roof']);
  B.push([0,2,1,'pink']);
  B.sort((a,b)=> (a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]) || a[2]-b[2]);
  let world = B.map(([x,y,z,t]) => cube(x,y,z,t, t==='water' ? 'class="tw" style="animation-duration:3s"' : '')).join('');
  // fallender Block (wird gerade gesetzt)
  const drop = `<g class="vxdrop">${cube(3,4,1,'planks')}</g>`;
  const [fx,fy] = pt(3.5,4.5,2);
  const coin = `<g transform="translate(${fx} ${fy-26})"><g class="vxcoin">
    <rect x="-7" y="-7" width="14" height="14" fill="#FFD43B" stroke="#B47A00" stroke-width="2"/><rect x="-3" y="-3" width="6" height="6" fill="#FFF3A8"/>
    <text x="11" y="5" font-family="Fredoka, Nunito, sans-serif" font-weight="700" font-size="13" fill="#fff" stroke="#7A4E00" stroke-width="3" paint-order="stroke">+10</text></g></g>`;
  // Klötzchen-Figur auf der Insel
  const [hx,hy] = pt(3.6,2.6,1);
  const kid = `<g transform="translate(${hx} ${hy})"><g class="vxkid">
    <rect x="-4" y="-12" width="3.5" height="12" fill="#3B4BA8"/><rect x="0.5" y="-12" width="3.5" height="12" fill="#2E3C8E"/>
    <rect x="-5" y="-26" width="10" height="14" fill="#E0498C"/>
    <g class="vxarm"><rect x="5" y="-26" width="3.5" height="12" fill="#E0498C"/><rect x="5" y="-15" width="3.5" height="3" fill="#F2C29A"/></g>
    <rect x="-8.5" y="-26" width="3.5" height="12" fill="#C93A7A"/><rect x="-8.5" y="-15" width="3.5" height="3" fill="#E8B48A"/>
    <rect x="-6" y="-38" width="12" height="12" fill="#F2C29A"/><rect x="-6" y="-38" width="12" height="4" fill="#5A3A22"/><rect x="-6" y="-35" width="2" height="4" fill="#5A3A22"/>
    <rect x="-3.5" y="-32" width="2" height="2" fill="#1F1A3A"/><rect x="1.5" y="-32" width="2" height="2" fill="#1F1A3A"/><rect x="-1.5" y="-29" width="3" height="1.2" fill="#B5634A"/>
  </g></g>`;
  // Pixel-Wolken und Sonne
  const cloud = (x,y,d) => `<g class="cloud" style="animation-delay:${d}s"><g transform="translate(${x} ${y})" fill="#fff" opacity=".9">
    <rect x="0" y="6" width="44" height="10"/><rect x="8" y="0" width="22" height="8"/></g></g>`;
  // Inventarleiste unten
  const slots = ['grass','planks','brick','pink','stone'];
  const bar = `<g transform="translate(${200 - slots.length*13} 218)">
    ${slots.map((t,i)=>`<g transform="translate(${i*26} 0)"><rect width="24" height="24" fill="rgba(30,20,50,.55)" stroke="${i===1?'#fff':'rgba(255,255,255,.45)'}" stroke-width="${i===1?2.5:1.5}"/>
      <rect x="5" y="5" width="14" height="14" fill="url(#vx-${T[t][0]})"/></g>`).join('')}</g>`;
  return `<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>${P}<linearGradient id="s5sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7EC8FF"/><stop offset="1" stop-color="#D8F0FF"/></linearGradient></defs>
  <rect width="400" height="250" fill="url(#s5sky)"/>
  <rect x="330" y="22" width="30" height="30" fill="#FFE27A"/><rect x="336" y="28" width="18" height="18" fill="#FFF3B0"/>
  ${cloud(0,30,0)}${cloud(0,62,-7)}${cloud(0,18,-13)}
  ${world}${drop}${coin}${kid}${bar}
  <g font-size="14"><text x="40" y="150" class="tw">✨</text><text x="345" y="150" class="tw" style="animation-delay:-1.2s">✨</text></g>
</svg>`; },

let blobUrl=null;
function appUrl(n){
  if(blobUrl) URL.revokeObjectURL(blobUrl);
  const bin=atob(APP_DATA[n]); const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  blobUrl=URL.createObjectURL(new Blob([bytes],{type:'text/html;charset=utf-8'}));
  return blobUrl;
}

const player = document.getElementById('player'), frame = document.getElementById('frame'), curtain = document.getElementById('curtain');
let current = null;
function openApp(n, origin){
  const a = APPS.find(x=>x.n===n); if(!a) return;
  current = a;
  player.style.setProperty('--c', a.c);
  if(origin){ player.style.setProperty('--ox', origin.x+'px'); player.style.setProperty('--oy', origin.y+'px'); }
  else { player.style.removeProperty('--ox'); player.style.removeProperty('--oy'); }
  document.getElementById('pTitle').textContent = `Gruppe ${a.n} · ${a.name}`;
  document.getElementById('cEmoji').textContent = a.emoji;
  document.getElementById('cName').textContent = a.name;
  curtain.classList.remove('hide');
  frame.onload = () => setTimeout(()=>curtain.classList.add('hide'), 350);
  frame.src = appUrl(a.n);
  player.classList.add('open');
  document.body.style.overflow = 'hidden';
  if(location.hash !== '#gruppe-'+n) history.replaceState(null,'','#gruppe-'+n);
}
function closeApp(){
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  player.classList.remove('open');
  frame.onload = null; frame.src = 'about:blank';
  document.body.style.overflow = '';
  if(location.hash) history.replaceState(null,'',location.pathname + location.search);
  const t = current && document.querySelector(`.tile[data-n="${current.n}"]`); if(t) t.focus();
  current = null;
}
grid.addEventListener('click', e=>{
  const t = e.target.closest('.tile'); if(!t) return;
  const r = t.getBoundingClientRect();
  openApp(+t.dataset.n, {x:r.left + r.width/2, y:r.top + r.height/3});
});
document.getElementById('backBtn').onclick = closeApp;
document.getElementById('fsBtn').onclick = () => {
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else if(player.requestFullscreen) player.requestFullscreen().catch(()=>{});
  }catch(e){}
};
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && player.classList.contains('open') && !document.fullscreenElement) closeApp(); });
function fromHash(){
  const m = location.hash.match(/^#gruppe-([1-6])$/);
  if(m) openApp(+m[1]); else if(player.classList.contains('open')) closeApp();
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
